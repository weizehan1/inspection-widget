# 巡检截图小组件 —— GitHub Actions 自动构建与发版
#
# 在 windows-latest 上用 MSBuild（VS2022 工具链）构建：
# - src/InspectionWidget.csproj 已设置 <ApplicationManifest>..\app.manifest</ApplicationManifest>，
#   MSBuild 构建时把 app.manifest 内嵌进 exe，产物为单文件，不再外置 .manifest
#   （本地 Mono xbuild 无法内嵌，才在 build/ 里外置一份，那是本地构建的差异）。
# - 每次 push 到 main 与手动 workflow_dispatch 都构建并上传 artifact。
# - 推送 v* 标签时，额外把 exe 附到同名 GitHub Release。

name: 构建巡检截图小组件

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      # 应用图标 assets/app.ico 是二进制文件，在仓库中以 base64 文本（assets/app.ico.base64.txt）存放，构建前还原。
      - name: 还原应用图标
        shell: pwsh
        run: |
          $b64 = Get-Content "assets/app.ico.base64.txt" -Raw
          [IO.File]::WriteAllBytes("assets/app.ico", [Convert]::FromBase64String($b64))

      # 不用 microsoft/setup-msbuild（仍基于已弃用的 Node 20，会报警告）：
      # runner 自带 vswhere，直接定位 VS2022 的 MSBuild.exe。
      - name: 定位 MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "未找到 MSBuild.exe" }
          "MSBUILD_PATH=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 构建主程序（Release）
        shell: pwsh
        run: '& $env:MSBUILD_PATH InspectionWidget.sln /p:Configuration=Release /m'

      # tests 工程未包含在 .sln 中，需单独构建；
      # 它是控制台 exe、自带极简测试框架，Main 以失败数决定退出码（0=全过，1=有失败），
      # 用例均为纯逻辑（含 System.Drawing 位图逻辑，不弹真实窗体），可在 runner 上直接运行。
      - name: 构建测试工程（Release）
        shell: pwsh
        run: '& $env:MSBUILD_PATH tests\InspectionWidget.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU'

      - name: 运行测试
        shell: pwsh
        run: |
          & tests\bin\Release\InspectionWidget.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw "测试失败，退出码 $LASTEXITCODE" }

      - name: 上传产物（单个 exe）
        uses: actions/upload-artifact@v5
        with:
          name: InspectionWidget
          path: src/bin/Release/InspectionWidget.exe
          if-no-files-found: error

      # 用 runner 自带的 gh 命令行发版，不再引第三方 action（避免其运行时版本弃用警告）。
      # 幂等（v1.0.3 加固）：同名 Release 已存在时 gh release create 会失败，此时改走 upload --clobber
      # 把 exe 挂到已有 Release 上，整步以最终命令的退出码定成败。
      - name: 发布 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} "src/bin/Release/InspectionWidget.exe" --title ${{ github.ref_name }} --notes "自动构建：MSBuild 于 windows-latest，manifest 已内嵌，单文件运行；配置默认存 %LocalAppData%\InspectionWidget"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "同名 Release 已存在，改走 upload 把 exe 挂到已有 Release"
            gh release upload ${{ github.ref_name }} "src/bin/Release/InspectionWidget.exe" --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 exe 到已有 Release 失败，退出码 $LASTEXITCODE" }
          }
